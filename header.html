<style id="header-language-selector-styles">
  .language-selector .dropdown-toggle {
    min-width: 4.5rem;
    padding: 0.46rem 0.7rem;
    border: 1px solid rgba(255, 255, 255, 0.24);
    border-radius: 0.8rem;
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }

  .language-selector .dropdown-toggle:hover,
  .language-selector .dropdown-toggle:focus {
    background: rgba(255, 255, 255, 0.16);
    border-color: rgba(255, 255, 255, 0.5);
    color: #fff;
    transform: translateY(-1px);
  }

  .language-selector .dropdown-toggle:focus {
    box-shadow: 0 0 0 0.22rem rgba(255, 255, 255, 0.16);
  }

  .language-selector .dropdown-toggle::after {
    margin-left: 0.5rem;
    vertical-align: 0.14em;
  }

  .language-selector-code {
    display: inline-block;
    min-width: 1.35rem;
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.09em;
    line-height: 1;
    text-align: center;
  }

  .language-selector .dropdown-menu {
    min-width: 8.25rem;
    padding: 0.4rem;
    margin-top: 0.55rem;
    border: 1px solid rgba(15, 45, 85, 0.1);
    border-radius: 1rem;
    box-shadow: 0 16px 34px rgba(10, 32, 60, 0.2);
  }

  .language-selector .dropdown-item {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 2.35rem;
    border-radius: 0.65rem;
    color: #17314a;
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    transition: background-color 0.18s ease, color 0.18s ease;
  }

  .language-selector .dropdown-item:hover,
  .language-selector .dropdown-item:focus,
  .language-selector .dropdown-item.is-active {
    background: #eaf2fc;
    color: #1f5aa6;
  }
</style>

<header class="container-fluid bg-dark text-white shadow-sm">
    
    <div class="row align-items-center py-3 text-center text-lg-start">
      <!-- Logo -->
      <div class="col-12 col-lg-4 d-flex justify-content-center justify-content-lg-start align-items-center mb-2 mb-lg-0 ps-lg-4">
        <a href="index.html">
          <img src="https://res.cloudinary.com/ddgxtuwdo/image/upload/v1781521973/copy_of_new_logo_lumoraevents_small_kwnjrc.png" 
              alt="Logo LumoraEvents" 
              class="me-2" 
              style="height: 40px;" 
              id="lumoraevents-logo">
        </a>
      </div>


      <!-- Event name -->
      <div class="col-12 col-lg-4 d-flex justify-content-center mb-2 mb-lg-0">
        <div class="bg-secondary bg-opacity-25 rounded-pill px-4 py-2 d-inline-block text-center">
          <a href="" id="event-name" class="fs-4 fs-lg-3 fw-semibold text-decoration-none text-white d-block"></a>
          <span id="event-info-badge" class="d-block text-warning fw-bold small mt-1"></span>
        </div>
      </div>

      <!-- User info -->
      <div class="col-12 col-lg-4 d-flex justify-content-center justify-content-lg-end align-items-center pe-lg-4">
        <i class="bi bi-person-circle fs-5 me-2"></i>
        <span id="user-name" class="fw-light me-2">Guest</span>
        <button id="auth-btn" class="btn btn-sm btn-outline-light">Login</button>
        <button id="admin-btn" type="button" class="btn btn-sm btn-warning ms-2 d-none">Admin</button>
      </div>

    </div>

    
    <div class="row bg-secondary bg-opacity-25 py-2 px-1 align-items-center">
      <div class="col-3 d-flex align-items-center">
        <a href="" class="text-decoration-none text-white d-flex align-items-center gap-2" id="home-link">
          <i class="bi bi-house-door-fill"></i>
          <span>Home</span>
        </a>
      </div>
      <div class="col-6 d-flex justify-content-center">
        <span id="screen-title" class="fw-semibold fs-5 fs-lg-1" data-i18n="title"></span>
      </div>
      <div class="col-3 d-flex justify-content-end align-items-center pe-3">
        <!-- Language selector -->
        <div class="dropdown language-selector">
          <button class="btn btn-sm dropdown-toggle" type="button" id="languageDropdown"
            data-bs-toggle="dropdown" aria-expanded="false" aria-label="Cambiar idioma" title="Cambiar idioma">
            <span class="language-selector-code" id="current-language-code">ES</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languageDropdown">
            <li>
              <button class="dropdown-item" type="button" data-language="es" aria-label="Español" onclick="changeLanguage('es')">
                ES
              </button>
            </li>
            <li>
              <button class="dropdown-item" type="button" data-language="en" aria-label="English" onclick="changeLanguage('en')">
                EN
              </button>
            </li>
            <li>
              <button class="dropdown-item" type="button" data-language="it" aria-label="Italiano" onclick="changeLanguage('it')">
                IT
              </button>
            </li>
            <li>
              <button class="dropdown-item" type="button" data-language="pt" aria-label="Português" onclick="changeLanguage('pt')">
                PT
              </button>
            </li>
            <li>
              <button class="dropdown-item" type="button" data-language="fr" aria-label="Français" onclick="changeLanguage('fr')">
                FR
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>

  </header>
