<style id="header-language-selector-styles">
  .app-header {
    --app-header-control-width: 2.55rem;
    --app-header-control-height: 2.1rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    background: #212529;
    color: #fff;
    box-shadow: inset 0 -2px 0 rgba(58, 183, 149, 0.65);
  }

  .app-header-main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, auto) minmax(0, 1fr);
    min-height: 58px;
    align-items: center;
    width: 100%;
    padding: 0 0.75rem;
  }

  .app-header-brand,
  .app-header-user {
    display: flex;
    min-width: 0;
    align-items: center;
  }

  .app-header-brand {
    justify-content: flex-start;
  }

  .app-header-user {
    justify-content: flex-end;
  }

  .app-header-logo {
    display: block;
    object-fit: contain;
  }

  .app-header-logo--full {
    display: none;
  }

  .app-header-logo--mark {
    width: 36px;
    height: 36px;
  }

  .app-event-heading {
    display: flex;
    width: 58vw;
    min-width: 0;
    max-width: 58vw;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .app-event-name {
    display: block;
    width: 100%;
    overflow: hidden;
    color: #fff;
    font-size: 1.05rem;
    font-weight: 650;
    line-height: 1.1;
    text-decoration: none;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .app-event-name:hover,
  .app-event-name:focus {
    color: #fff;
  }

  .app-event-info-badge:empty {
    display: none;
  }

  .app-event-info-badge {
    margin-top: 0.2rem;
    color: #ffd24d;
    font-size: 0.58rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    line-height: 1;
  }

  .app-user-toggle {
    display: inline-flex;
    width: var(--app-header-control-width);
    height: var(--app-header-control-height);
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, 0.24);
    border-radius: 0.7rem;
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    box-shadow: none;
    transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
  }

  .app-user-toggle:hover,
  .app-user-toggle:focus {
    border-color: rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
    transform: translateY(-1px);
  }

  .app-user-toggle:focus {
    box-shadow: 0 0 0 0.2rem rgba(255, 255, 255, 0.14);
  }

  .app-user-toggle::after {
    display: none;
  }

  .app-user-toggle .bi {
    font-size: 1.15rem;
  }

  .app-user-menu .dropdown-menu {
    min-width: 13rem;
    padding: 0.55rem;
    margin-top: 0.55rem;
    border: 1px solid rgba(15, 45, 85, 0.1);
    border-radius: 1rem;
    box-shadow: 0 16px 34px rgba(10, 32, 60, 0.2);
  }

  .app-user-identity {
    display: flex;
    min-width: 0;
    align-items: center;
    gap: 0.55rem;
    padding: 0.55rem 0.65rem 0.7rem;
    border-bottom: 1px solid var(--bs-border-color-translucent);
    color: #17314a;
  }

  .app-user-identity .bi {
    flex: 0 0 auto;
    font-size: 1.1rem;
  }

  .app-user-name {
    overflow: hidden;
    font-size: 0.82rem;
    font-weight: 650;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .app-user-actions {
    display: grid;
    gap: 0.35rem;
    padding-top: 0.5rem;
  }

  .app-user-action {
    width: 100%;
    min-height: 2.25rem;
    border-radius: 0.6rem;
    font-size: 0.82rem;
    font-weight: 650;
  }

  .app-subheader {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, auto) minmax(0, 1fr);
    min-height: 46px;
    align-items: center;
    padding: 0.35rem 0.75rem;
    background: rgba(255, 255, 255, 0.08);
  }

  .app-home-area,
  .app-language-area {
    display: flex;
    min-width: 0;
    align-items: center;
  }

  .app-home-area {
    justify-content: flex-start;
  }

  .app-language-area {
    justify-content: flex-end;
  }

  .app-home-link {
    display: inline-flex;
    width: var(--app-header-control-width);
    height: var(--app-header-control-height);
    align-items: center;
    justify-content: center;
    border: 1px solid transparent;
    border-radius: 0.65rem;
    color: #fff;
    text-decoration: none;
    transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
  }

  .app-home-link:hover,
  .app-home-link:focus-visible {
    border-color: rgba(255, 255, 255, 0.22);
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    transform: translateY(-1px);
  }

  .app-home-label {
    display: none;
  }

  .app-screen-title {
    display: block;
    width: 54vw;
    min-width: 0;
    max-width: 54vw;
    overflow: hidden;
    font-size: 1rem;
    font-weight: 650;
    line-height: 1.1;
    text-align: center;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .app-header .language-selector {
    width: var(--app-header-control-width);
    height: var(--app-header-control-height);
    flex: 0 0 var(--app-header-control-width);
  }

  .app-header .language-selector .dropdown-toggle {
    display: inline-flex;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: center;
    padding: 0.25rem;
    border: 1px solid rgba(255, 255, 255, 0.24);
    border-radius: 0.7rem;
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    box-shadow: none;
    transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
  }

  .app-header .language-selector .dropdown-toggle:hover,
  .app-header .language-selector .dropdown-toggle:focus {
    border-color: rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
    transform: translateY(-1px);
  }

  .app-header .language-selector .dropdown-toggle:focus {
    box-shadow: 0 0 0 0.2rem rgba(255, 255, 255, 0.14);
  }

  .app-header .language-selector .dropdown-toggle::after {
    margin-left: 0.2rem;
    vertical-align: 0.1em;
  }

  .language-selector-code {
    display: inline-block;
    min-width: 1.2rem;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    line-height: 1;
    text-align: center;
  }

  .app-header .language-selector .dropdown-menu {
    min-width: 8.25rem;
    padding: 0.4rem;
    margin-top: 0.55rem;
    border: 1px solid rgba(15, 45, 85, 0.1);
    border-radius: 1rem;
    box-shadow: 0 16px 34px rgba(10, 32, 60, 0.2);
  }

  .app-header .language-selector .dropdown-item {
    display: flex;
    min-height: 2.35rem;
    align-items: center;
    justify-content: center;
    border-radius: 0.65rem;
    color: #17314a;
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    transition: background-color 0.18s ease, color 0.18s ease;
  }

  .app-header .language-selector .dropdown-item:hover,
  .app-header .language-selector .dropdown-item:focus,
  .app-header .language-selector .dropdown-item.is-active {
    background: #eaf2fc;
    color: #1f5aa6;
  }

  @media (min-width: 768px) {
    .app-header {
      --app-header-control-width: 3.3rem;
      --app-header-control-height: 2.15rem;
    }

    .app-header-main {
      min-height: 64px;
      padding: 0 1.5rem;
    }

    .app-header-logo--full {
      display: block;
      width: auto;
      height: 36px;
      max-width: 205px;
    }

    .app-header-logo--mark {
      display: none;
    }

    .app-event-heading {
      width: auto;
      max-width: 42vw;
    }

    .app-event-name {
      padding: 0.42rem 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      font-size: 1.18rem;
    }

    .app-event-info-badge {
      font-size: 0.65rem;
    }

    .app-subheader {
      min-height: 50px;
      padding: 0.4rem 1.5rem;
    }

    .app-home-link {
      width: auto;
      min-width: var(--app-header-control-width);
      gap: 0.45rem;
      padding: 0.3rem 0.55rem;
    }

    .app-home-label {
      display: inline;
      font-size: 0.85rem;
      font-weight: 650;
    }

    .app-screen-title {
      width: auto;
      max-width: 46vw;
      font-size: 1.2rem;
    }

    .app-header .language-selector .dropdown-toggle {
      width: auto;
      min-width: 100%;
      padding: 0.25rem 0.4rem;
    }
  }

  @media (min-width: 992px) {
    .app-user-toggle {
      display: none;
    }

    .app-user-menu .dropdown-menu {
      position: static !important;
      display: flex !important;
      min-width: 0;
      align-items: center;
      gap: 0.45rem;
      padding: 0;
      margin: 0;
      transform: none !important;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .app-user-identity {
      max-width: 13rem;
      gap: 0.4rem;
      padding: 0;
      border: 0;
      color: #fff;
    }

    .app-user-name {
      font-size: 0.8rem;
      font-weight: 400;
    }

    .app-user-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0;
    }

    .app-user-action {
      width: auto;
      min-height: var(--app-header-control-height);
      padding: 0.3rem 0.55rem;
    }
  }
</style>

<header class="app-header">
  <div class="app-header-main">
    <div class="app-header-brand">
      <a href="index.html" aria-label="LumoraEvents">
        <img class="app-header-logo app-header-logo--full"
          src="https://res.cloudinary.com/ddgxtuwdo/image/upload/v1781521973/copy_of_new_logo_lumoraevents_small_kwnjrc.png"
          alt="LumoraEvents" id="lumoraevents-logo">
        <img class="app-header-logo app-header-logo--mark"
          src="https://res.cloudinary.com/ddgxtuwdo/image/upload/v1789748600/isotipo-lumoraevents_ylusci.png"
          alt="LumoraEvents">
      </a>
    </div>

    <div class="app-event-heading">
      <a href="" id="event-name" class="app-event-name"></a>
      <span id="event-info-badge" class="app-event-info-badge"></span>
    </div>

    <div class="app-header-user">
      <div class="dropdown app-user-menu">
        <button class="btn dropdown-toggle app-user-toggle" type="button" id="userMenuDropdown"
          data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menú de usuario" title="Menú de usuario">
          <i class="bi bi-person-circle" aria-hidden="true"></i>
        </button>
        <div class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenuDropdown">
          <div class="app-user-identity">
            <i class="bi bi-person-circle" aria-hidden="true"></i>
            <span id="user-name" class="app-user-name">Guest</span>
          </div>
          <div class="app-user-actions">
            <button id="auth-btn" type="button" class="btn btn-sm btn-outline-secondary app-user-action">Login</button>
            <button id="admin-btn" type="button" class="btn btn-sm btn-warning app-user-action d-none">Admin</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="app-subheader">
    <div class="app-home-area">
      <a href="" class="app-home-link" id="home-link" aria-label="Home" title="Home">
        <i class="bi bi-house-door-fill" aria-hidden="true"></i>
        <span class="app-home-label">Home</span>
      </a>
    </div>

    <span id="screen-title" class="app-screen-title" data-i18n="title"></span>

    <div class="app-language-area">
      <div class="dropdown language-selector">
        <button class="btn btn-sm dropdown-toggle" type="button" id="languageDropdown"
          data-bs-toggle="dropdown" aria-expanded="false" aria-label="Cambiar idioma" title="Cambiar idioma">
          <span class="language-selector-code" id="current-language-code">ES</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languageDropdown">
          <li><button class="dropdown-item" type="button" data-language="es" aria-label="Español" onclick="changeLanguage('es')">ES</button></li>
          <li><button class="dropdown-item" type="button" data-language="en" aria-label="English" onclick="changeLanguage('en')">EN</button></li>
          <li><button class="dropdown-item" type="button" data-language="it" aria-label="Italiano" onclick="changeLanguage('it')">IT</button></li>
          <li><button class="dropdown-item" type="button" data-language="pt" aria-label="Português" onclick="changeLanguage('pt')">PT</button></li>
          <li><button class="dropdown-item" type="button" data-language="fr" aria-label="Français" onclick="changeLanguage('fr')">FR</button></li>
        </ul>
      </div>
    </div>
  </div>
</header>
