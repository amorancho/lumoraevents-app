<style id="app-footer-styles">
  .app-footer {
    border-top: 1px solid var(--lm-border, #244057);
    background: var(--lm-bg-elevated, #0b1b2b);
    color: var(--lm-text, #f3f7fd);
  }

  .app-footer-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    width: 100%;
    max-width: 1150px;
    padding: 0.75rem 1rem;
    margin-inline: auto;
  }

  .app-footer-brand {
    color: var(--lm-text-muted, #b6c7da);
    font-size: 0.8rem;
  }

  .app-footer-links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.1rem 0.75rem;
  }

  .app-footer-link {
    display: inline-flex;
    align-items: center;
    min-height: 2.25rem;
    padding: 0.2rem;
    color: var(--lm-text-muted, #b6c7da);
    font-size: 0.8rem;
    line-height: 1.2;
    text-decoration: none;
    transition: color 0.15s ease;
  }

  .app-footer-link:hover {
    color: var(--lm-cyan, #26d7e8);
  }

  .app-footer-link:focus-visible {
    outline: 2px solid var(--lm-cyan, #26d7e8);
    outline-offset: 2px;
    border-radius: var(--lm-radius-sm, .55rem);
  }

  .app-footer-instagram {
    justify-content: center;
    min-width: 2rem;
    font-size: 1rem;
    color: var(--lm-purple, #b68aff);
  }

  @media (min-width: 768px) {
    .app-footer-inner {
      flex-direction: row;
      justify-content: space-between;
      gap: 1rem;
      padding-right: 1.5rem;
      padding-left: 1.5rem;
    }

    .app-footer-links {
      justify-content: flex-end;
    }
  }
</style>

<footer id="footer" class="app-footer mt-auto">
  <div class="app-footer-inner">
    <span id="regName" class="app-footer-brand">© 2026 LumoraEvents</span>

    <nav class="app-footer-links" aria-label="Legal links">
      <a href="/terms.html" target="_blank" rel="noopener noreferrer" class="app-footer-link">Terms</a>
      <a href="/privacy.html" target="_blank" rel="noopener noreferrer" class="app-footer-link">Privacy</a>
      <a href="/cookies.html" target="_blank" rel="noopener noreferrer" class="app-footer-link">Cookies</a>
      <a href="https://instagram.com/lumoraevents.app" target="_blank" rel="noopener noreferrer" class="app-footer-link app-footer-instagram" aria-label="Instagram" title="Instagram">
        <i class="bi bi-instagram" aria-hidden="true"></i>
      </a>
    </nav>
  </div>
</footer>
