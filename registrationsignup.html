<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon32.png" type="image/png">
  <title data-i18n="title">Registration Signup - LumoraEvents</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/lumora-ui.css?v=20261004-3">
  <link rel="stylesheet" href="css/registration-access.css?v=20261014-1">
  <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
  <script src="https://cdn.counter.dev/script.js" data-id="b4163310-ede9-4a5d-8386-8fe6df71a9fb" data-utcoffset="2"></script>
</head>
<body class="d-flex flex-column min-vh-100 registration-access-page registration-signup-page">
  
  <div id="header"></div>  
  <main class="lm-page flex-grow-1 registration-access-main">
    <div class="registration-access-shell registration-signup-shell">
      <header class="registration-access-intro registration-signup-intro">
        <span class="registration-access-mark" aria-hidden="true"><i class="bi bi-person-plus"></i></span>
        <h1 data-i18n="signup_title">Create school account</h1>
        <p data-i18n="signup_subtitle">Complete the form to request access.</p>
      </header>

      <div class="registration-form-card lm-card">
        <div class="registration-form-body">
          <div class="registration-notice lm-notice alert-info" role="alert">
            <i class="bi bi-envelope-check" aria-hidden="true"></i>
            <span data-i18n="signup_notice">After creating the account, you will receive your access credentials by email in the next few minutes.</span>
          </div>

          <form id="signupForm" novalidate>
            <fieldset class="registration-type-fieldset">
              <legend data-i18n="field_user_type">Account type</legend>
              <div class="registration-type-options">
                <label class="registration-type-option" for="signupUserTypeSchool">
                  <input class="form-check-input" type="radio" name="signupUserType" id="signupUserTypeSchool" value="SCH" checked>
                  <i class="bi bi-building" aria-hidden="true"></i><span data-i18n="user_type_school">School</span>
                </label>
                <label class="registration-type-option" for="signupUserTypeIndividual">
                  <input class="form-check-input" type="radio" name="signupUserType" id="signupUserTypeIndividual" value="PAR">
                  <i class="bi bi-person" aria-hidden="true"></i><span data-i18n="user_type_individual">Individual</span>
                </label>
              </div>
            </fieldset>

                <div class="row g-3 registration-fields">
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="signupName" data-i18n="field_name">Name</label>
                    <input type="text" class="form-control" id="signupName" required>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="signupUsername" data-i18n="field_username">Username</label>
                    <div class="input-group">
                      <span class="input-group-text" id="signupUsernamePrefix">sch_</span>
                      <input type="text" class="form-control" id="signupUsername" required>
                    </div>
                  </div>
                  <div class="col-12 col-md-8">
                    <label class="form-label" for="signupEmail" data-i18n="field_email">Email</label>
                    <input type="email" class="form-control" id="signupEmail" required>
                  </div>
                  <div class="col-12 col-md-4">
                    <label class="form-label" for="signupLanguage" data-i18n="field_language">Language</label>
                    <select class="form-select" id="signupLanguage">
                      <option value="es">ES</option>
                      <option value="en">EN</option>
                      <option value="it">IT</option>
                      <option value="pt">PT</option>
                      <option value="fr">FR</option>
                    </select>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="signupCity" data-i18n="field_city">City</label>
                    <input type="text" class="form-control" id="signupCity" required>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="signupCountry" data-i18n="field_country">Country</label>
                    <select id="signupCountry" class="form-select" required>
                      <option value=""></option>
                    </select>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="signupPhone" data-i18n="field_phone">Phone</label>
                    <input type="text" class="form-control" id="signupPhone" required>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="signupRepresentative" data-i18n="field_representative">Representative</label>
                    <input type="text" class="form-control" id="signupRepresentative" required>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="signupDocument" data-i18n="field_document">Fiscal document</label>
                    <input type="text" class="form-control" id="signupDocument">
                    <div class="form-text" data-i18n="field_document_help">Provide it if you would like an invoice for registrations.</div>
                  </div>
                </div>

                <div class="registration-form-actions">
                  <a id="cancelLink" class="lm-btn lm-btn-secondary" href="registrationhome.html" data-i18n="cancel">Cancel</a>
                  <button type="submit" class="lm-btn lm-btn-primary" id="signupSubmit" data-i18n="signup_submit">Create account</button>
                </div>
              </form>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/common.js?v=20260917"></script>
  <script src="utils/countries.js"></script>
  <script src="js/registrationsignup.js"></script>

</body></html>
