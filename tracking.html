<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon32.png" type="image/png">
  <title data-i18n="title">Competition Tracking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.counter.dev/script.js" data-id="b4163310-ede9-4a5d-8386-8fe6df71a9fb" data-utcoffset="2"></script>
  <link rel="stylesheet" href="css/lumora-ui.css?v=20261004-3">
  <link rel="stylesheet" href="css/tracking.css?v=20261004-11">
</head>
<body class="d-flex flex-column min-vh-100 tracking-page">

  <div id="header"></div>

  <div class="container-fluid lm-page lm-org-shell flex-grow-1">
    <div id="organizationSidebarToggle" class="d-lg-none"></div>
    <div class="row g-4 align-items-start lm-org-layout tracking-org-layout">
      <aside class="col-lg-3 col-xl-2 d-none d-lg-block lm-org-sidebar-column tracking-org-sidebar" id="trackingOrganizationSidebar">
        <div id="organizationSidebarMount"></div>
      </aside>
      <main class="col-12 col-lg-9 col-xl-10 lm-org-main tracking-main">
    <h1 class="visually-hidden" data-i18n="title">Competition Tracking</h1>
    <div id="trackingContainer">
      <div class="row g-3 align-items-start tracking-columns">
        <div class="col-12 col-xl-3 tracking-left-column">
          <div class="card tracking-left-card">
            <div class="card-header tracking-left-card-header">
              <h2 class="tracking-panel-title"><i class="bi bi-trophy" aria-hidden="true"></i><span data-i18n="tracking_competitions_title">Competiciones</span></h2>
              <div class="tracking-left-header-actions">
                <button class="btn btn-outline-secondary btn-sm d-none d-lg-inline-flex tracking-org-sidebar-toggle" id="trackingOrgSidebarToggle" type="button" aria-controls="trackingOrganizationSidebar" aria-expanded="false" aria-label="Mostrar menú" title="Mostrar menú" data-i18n-aria-label="tracking_show_menu" data-i18n-title="tracking_show_menu">
                  <i class="bi bi-list" aria-hidden="true"></i>
                </button>
                <button class="btn btn-warning btn-sm" id="exportBtn" type="button"><i class="bi bi-download" aria-hidden="true"></i><span data-i18n="export_results_button">Export Results</span></button>
              </div>
            </div>
            <div class="card-body p-0">
              <div class="tracking-sidebar-filters">
                <div class="row g-1">
                  <div class="col-4">
                    <select class="form-select form-select-sm" id="trackingCategoryFilter" aria-label="Categoría" title="Categoría" data-i18n-aria-label="category" data-i18n-title="category">
                      <option value="">Todas Categorías</option>
                    </select>
                  </div>
                  <div class="col-4">
                    <select class="form-select form-select-sm" id="trackingStyleFilter" aria-label="Estilo" title="Estilo" data-i18n-aria-label="style" data-i18n-title="style">
                      <option value="">Todos Estilos</option>
                    </select>
                  </div>
                  <div class="col-4">
                    <select class="form-select form-select-sm" id="trackingStatusFilter" aria-label="Estado" title="Estado" data-i18n-aria-label="status" data-i18n-title="status">
                      <option value="">Todos Estados</option>
                    </select>
                  </div>
                </div>
              </div>
              <div id="competitionsSidebarList" class="list-group tracking-competitions-list"></div>
            </div>
          </div>
        </div>
        <div class="col-12 col-xl-9 tracking-center-column">
          <div id="competitionsContainer">
            <div class="tracking-empty">
              <i class="bi bi-activity" aria-hidden="true"></i>
              <p data-i18n="tracking_select_competition_hint">Selecciona una competición para ver su seguimiento.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
      </main>
    </div>


    <div class="modal fade lm-modal tracking-modal" id="voteDetailsModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" data-i18n="voting_details">Detalles de votación</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <div id="voteDetailsBody"></div>
          </div>
          <div class="modal-footer"></div>
        </div>
      </div>
    </div>

    <div class="modal fade lm-modal tracking-modal" id="detailsModal" tabindex="-1" aria-labelledby="detailsModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="detailsModalLabel" data-i18n="view_details">Details</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3 text-center" id="criteriaContainer"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal" data-i18n="close">Close</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade lm-modal tracking-modal" id="resultsModal" tabindex="-1" aria-labelledby="resultsModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="resultsModalLabel" data-i18n="view_results">View Results</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="resultsModalBody"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary d-none" id="saveClassificationBtn" data-i18n="save_classification">Save Classification</button>
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal" data-i18n="close">Close</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade lm-modal tracking-modal" id="classificationExportOptionsModal" tabindex="-1" aria-labelledby="classificationExportOptionsModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="classificationExportOptionsModalLabel">Export Results</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="classificationExportOptionsBody">
            <div class="d-flex align-items-center justify-content-center py-4">
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              <span data-i18n="loading">Loading...</span>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-success btn-sm" id="classificationExportExcelBtn">
              <i class="bi bi-file-earmark-excel me-1" aria-hidden="true"></i>
              <span>Export Excel</span>
            </button>
            <button type="button" class="btn btn-danger btn-sm" id="classificationExportPdfBtn">
              <i class="bi bi-file-earmark-pdf me-1" aria-hidden="true"></i>
              <span>Export PDF</span>
            </button>
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal" data-i18n="close">Close</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade lm-modal tracking-modal" id="penaltyAssignmentModal" tabindex="-1" aria-labelledby="penaltyAssignmentModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="penaltyAssignmentModalLabel" data-i18n="penalty_modal_title">Penalties</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="penaltyAssignmentModalBody">
            <div class="d-flex align-items-center justify-content-center py-4">
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              <span data-i18n="loading">Loading...</span>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary btn-sm" id="penaltyAssignmentSaveBtn" data-i18n="penalty_modal_save">Save</button>
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal" data-i18n="close">Close</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade lm-modal tracking-modal" id="dancersOrderModal" tabindex="-1" aria-labelledby="dancersOrderModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-md">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="dancersOrderModalLabel" data-i18n="dancers_order_modal_title">Ordenar bailarinas</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <ul id="sortableDancers" class="list-group"></ul>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" id="saveDancerOrder" data-i18n="save_dancer_order">Guardar orden</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="close">Cerrar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<div class="modal fade lm-modal tracking-modal" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" data-i18n="clear_confirm_title">Clear Voting Confirm</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="deleteModalMessage" data-i18n="clear_confirm_text">Are you sure you want to clear this voting?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBtn" data-i18n="confirm">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/header.js?v=20261002-1"></script>
  <script src="js/footer.js"></script>
  <script src="js/common.js?v=20261005-2"></script>
  <script src="js/sidebar.js?v=20261005-3"></script>
  <script src="js/tracking.js?v=20261004-5"></script>
</body>
</html>
