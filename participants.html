<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon32.png" type="image/png">
  <title data-i18n="title">Participants</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/lumora-ui.css?v=20260930-1">
  <link rel="stylesheet" href="css/participants.css?v=20260930-1">
  <script src="https://cdn.counter.dev/script.js" data-id="b4163310-ede9-4a5d-8386-8fe6df71a9fb" data-utcoffset="2"></script>
</head>

<body class="d-flex flex-column min-vh-100 participants-page">
  <div id="header"></div>

  <main class="lm-page">
    <div class="lm-container participants-content">
      <div class="lm-instagram-section">
        <a class="lm-instagram-card" href="https://www.instagram.com/lumoraevents.app/" target="_blank" rel="noopener noreferrer" aria-label="Instagram lumoraevents.app">
          <span class="lm-instagram-icon" aria-hidden="true"><i class="bi bi-instagram"></i></span>
          <span class="lm-instagram-title" data-i18n="instagram_follow_message">Síguenos para no perderte nada</span>
          <span class="lm-instagram-handle">@lumoraevents.app <i class="bi bi-arrow-up-right" aria-hidden="true"></i></span>
        </a>
      </div>

      <div id="noticePanel" class="participants-notice" style="display: none;">
        <div class="alert alert-dismissible fade show lm-notice" role="alert" id="notice_type">
          <div id="notice_text"></div>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      </div>

      <section id="participantsSummary" class="participants-summary">
        <article id="statsColCat" class="participants-stat">
          <i class="bi bi-grid-fill participants-stat-icon" aria-hidden="true"></i>
          <strong class="participants-stat-value" id="numCat"></strong>
          <span class="participants-stat-label" data-i18n="categories">Categories</span>
        </article>
        <article id="statsColSty" class="participants-stat">
          <i class="bi bi-lightning-charge-fill participants-stat-icon" aria-hidden="true"></i>
          <strong class="participants-stat-value" id="numSty"></strong>
          <span class="participants-stat-label" data-i18n="styles">Styles</span>
        </article>
        <article id="statsColPar" class="participants-stat">
          <i class="bi bi-people-fill participants-stat-icon" aria-hidden="true"></i>
          <strong class="participants-stat-value" id="numPar"></strong>
          <span class="participants-stat-label" data-i18n="participants">Participants</span>
        </article>
        <article id="statsColNat" class="participants-stat">
          <i class="bi bi-globe2 participants-stat-icon" aria-hidden="true"></i>
          <strong class="participants-stat-value" id="numNat"></strong>
          <span class="participants-stat-label" data-i18n="nationalities">Nationalities</span>
        </article>
      </section>

      <section id="natDistributionSection" class="participants-nationalities">
        <div class="participants-section-label">
          <i class="bi bi-globe2" aria-hidden="true"></i>
          <span data-i18n="nationalities">Nationalities</span>
        </div>
        <div id="parByNat" class="participants-nationality-list"></div>
      </section>

      <form id="participantsSearchForm" class="participants-search" role="search">
        <div class="participants-search-field">
          <i class="bi bi-search" aria-hidden="true"></i>
          <label class="visually-hidden" for="buscador" data-i18n="search">Search</label>
          <input type="search" id="buscador" class="form-control" placeholder="Search for participant by first or last name" data-i18n-placeholder="search_placeholder">
        </div>
        <button type="submit" class="lm-btn participants-search-btn" data-i18n="search">Search</button>
        <button type="button" id="clearSearchBtn" class="lm-btn lm-btn-secondary participants-clear-btn" data-i18n="clear">Clear</button>
      </form>

      <div id="participantsContainer" class="participants-categories" aria-live="polite"></div>
    </div>
  </main>

  <div class="modal fade participants-modal" id="styleDancersModal" tabindex="-1" aria-labelledby="styleDancersModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-md modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="styleDancersModalLabel" data-i18n="dancer_styles">Participants in this style</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="participants-estimated-time">
            <i class="bi bi-clock" aria-hidden="true"></i>
            <span data-i18n="stimated_start">Estimated Start: </span>
            <strong id="estimatedStart"></strong>
          </div>
          <ol id="styleDancersList" class="participants-modal-list"></ol>
        </div>
        <div class="modal-footer">
          <button type="button" class="lm-btn lm-btn-secondary" data-bs-dismiss="modal" data-i18n="close">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade participants-modal" id="styleScheduleModal" tabindex="-1" aria-labelledby="styleScheduleLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-md modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="styleScheduleLabel">Styles Schedule</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="table-responsive participants-modal-table-wrap">
            <table class="table participants-modal-table">
              <thead>
                <tr>
                  <th data-i18n="col_style">Style</th>
                  <th data-i18n="col_start">Estimated Start Time</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="lm-btn lm-btn-secondary" data-bs-dismiss="modal" data-i18n="close">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/common.js?v=20260917"></script>
  <script src="js/participants.js?v=20260930-1"></script>
</body>
</html>
