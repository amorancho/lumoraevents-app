<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon32.png" type="image/png">
  <title>LumoraEvents</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/lumora-ui.css?v=20260930-1">
  <link rel="stylesheet" href="css/index.css?v=20261002-2">
  <script src="https://cdn.counter.dev/script.js" data-id="b4163310-ede9-4a5d-8386-8fe6df71a9fb" data-utcoffset="2"></script>
</head>
<body class="d-flex flex-column min-vh-100 index-page">
  <header class="app-header index-header">
    <div class="app-header-main">
      <div class="app-header-brand">
        <a href="index.html" aria-label="LumoraEvents">
          <img class="app-header-logo app-header-logo--full" src="https://res.cloudinary.com/ddgxtuwdo/image/upload/v1781521973/copy_of_new_logo_lumoraevents_small_kwnjrc.png" alt="LumoraEvents">
          <img class="app-header-logo app-header-logo--mark" src="https://res.cloudinary.com/ddgxtuwdo/image/upload/v1789748600/isotipo-lumoraevents_ylusci.png" alt="LumoraEvents">
        </a>
      </div>
      <h1 class="app-event-heading">
        <a href="" id="event-name" class="app-event-name" data-i18n="home_title">Events</a>
      </h1>
      <div class="app-header-user">
        <button id="admin-btn" type="button" class="btn btn-warning app-user-action index-admin-btn d-none" aria-label="Admin" title="Admin">
          <i class="bi bi-shield-lock" aria-hidden="true"></i><span class="index-admin-label">Admin</span>
        </button>
        <div class="dropdown language-selector">
          <button class="btn btn-sm dropdown-toggle" type="button" id="languageDropdown" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Cambiar idioma" title="Cambiar idioma">
            <span class="language-selector-code" id="current-language-code">ES</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languageDropdown">
            <li><button class="dropdown-item" type="button" data-language="es" aria-label="Español" onclick="changeLanguage('es')">ES</button></li>
            <li><button class="dropdown-item" type="button" data-language="en" aria-label="English" onclick="changeLanguage('en')">EN</button></li>
            <li><button class="dropdown-item" type="button" data-language="it" aria-label="Italiano" onclick="changeLanguage('it')">IT</button></li>
            <li><button class="dropdown-item" type="button" data-language="pt" aria-label="Português" onclick="changeLanguage('pt')">PT</button></li>
            <li><button class="dropdown-item" type="button" data-language="fr" aria-label="Français" onclick="changeLanguage('fr')">FR</button></li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <main class="lm-page index-main">
    <div class="lm-container index-content">
      <section class="index-discover" aria-label="Events" data-i18n-aria-label="home_title">
        <div class="index-filter-panel">
          <div class="index-filter-fields">
            <label class="index-search-field" for="eventSearchInput">
              <i class="bi bi-search" aria-hidden="true"></i>
              <input type="search" id="eventSearchInput" class="form-control lm-input" data-i18n-placeholder="search_by_name_placeholder" data-i18n-aria-label="search_by_name" placeholder="Search event" aria-label="Search by name">
            </label>
            <div class="index-category-field">
              <select id="eventCategoryFilter" class="form-select lm-input" data-i18n-aria-label="filter_by_category" aria-label="Filter by category">
                <option value="" data-i18n="all_categories">All Categories</option>
              </select>
              <i class="bi bi-chevron-down" aria-hidden="true"></i>
            </div>
          </div>
          <div id="eventStatusFilters" class="index-status-filters" role="group" data-i18n-aria-label="filter_by_status" aria-label="Filter by status">
            <button type="button" class="index-filter-btn active" data-status-filter="all" aria-pressed="true"><i class="bi bi-grid-3x3-gap-fill" aria-hidden="true"></i><span data-i18n="all">All</span></button>
            <button type="button" class="index-filter-btn" data-status-filter="en_curso" aria-pressed="false"><i class="bi bi-broadcast-pin" aria-hidden="true"></i><span data-i18n="en_curso">Ongoing</span></button>
            <button type="button" class="index-filter-btn" data-status-filter="proximamente" aria-pressed="false"><i class="bi bi-calendar-event" aria-hidden="true"></i><span data-i18n="proximamente">Upcoming</span></button>
            <button type="button" class="index-filter-btn" data-status-filter="finalizado" aria-pressed="false"><i class="bi bi-check-circle" aria-hidden="true"></i><span data-i18n="finalizado">Finished</span></button>
          </div>
        </div>
        <div id="eventsContainer" class="index-events"></div>
      </section>
    </div>
  </main>

  <div class="modal fade lm-modal event-details-modal" id="eventDetailsModal" tabindex="-1" aria-labelledby="eventDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="btn event-details-close" data-bs-dismiss="modal" data-i18n-title="close" title="Close" aria-label="Close">
            <i class="bi bi-x-lg" aria-hidden="true"></i>
          </button>
          <div class="event-details-hero">
            <div class="row g-4 align-items-center">
              <div class="col-12 col-lg-4 d-flex justify-content-center justify-content-lg-start">
                <div class="event-details-logo-shell">
                  <img id="eventDetailsLogo" src="" alt="">
                </div>
              </div>
              <div class="col-12 col-lg-8">
                <div class="d-flex flex-column gap-3">
                  <div class="d-flex flex-wrap align-items-center gap-2">
                    <span class="event-details-status-badge" id="eventDetailsStatusBadge"></span>
                  </div>
                  <div>
                    <h2 class="fw-bold mb-0 event-details-title" id="eventDetailsModalLabel">Event details</h2>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-body">
          <div class="row g-4">
            <div class="col-12">
              <div id="eventDetailsInfoList" class="event-details-info-list"></div>
            </div>
            <div class="col-12 col-lg-auto d-none" id="eventDetailsPosterColumn">
              <div id="eventDetailsPoster"></div>
            </div>
            <div class="col-12" id="eventDetailsDescriptionColumn">
              <div class="event-details-panel">
                <div class="event-details-panel-title">
                  <i class="bi bi-card-text"></i>
                  <span data-i18n="event_details_description_title">About this event</span>
                </div>
                <div id="eventDetailsDescription" class="event-details-description"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer event-details-footer">
          <button type="button" class="lm-btn lm-btn-secondary" data-bs-dismiss="modal" data-i18n="close">Close</button>
          <a href="#" class="lm-btn lm-btn-primary" id="eventDetailsGoToEventBtn" data-i18n="go_to_event">Go to Event</a>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade lm-modal event-poster-preview-modal" id="eventPosterPreviewModal" tabindex="-1" aria-labelledby="eventPosterPreviewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 px-4 pt-4">
          <h5 class="modal-title text-white fw-semibold" id="eventPosterPreviewModalLabel" data-i18n="event_details_poster_preview_title">Poster del evento</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" data-i18n-title="close" title="Close" aria-label="Close"></button>
        </div>
        <div class="modal-body event-poster-preview-body px-4 pb-4">
          <img id="eventPosterPreviewImage" src="" alt="">
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/common.js?v=20260917"></script>
  <script src="utils/countries.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="js/index.js?v=20261002-1"></script>

</body></html>
