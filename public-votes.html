<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon32.png" type="image/png">
  <title data-i18n="title">Audience voting</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/lumora-ui.css?v=20260930-1">
  <link rel="stylesheet" href="css/public-voting.css?v=20261011-1">
  <script src="https://cdn.counter.dev/script.js" data-id="b4163310-ede9-4a5d-8386-8fe6df71a9fb" data-utcoffset="2"></script>
</head>
<body class="d-flex flex-column min-vh-100 lm-page public-voting-page public-votes-page">
  <div id="header"></div>

  <main class="lm-container public-voting-main public-votes-shell flex-grow-1">
    <div class="public-votes-intro">
      <div>
        <h1 class="public-votes-title"><i class="bi bi-megaphone" aria-hidden="true"></i><span data-i18n="page_heading">Audience voting</span></h1>
        <p class="public-votes-description" data-i18n="page_intro">Vote in an open session or view published results.</p>
      </div>
      <a class="lm-btn lm-btn-secondary public-voting-back" href="home.html" data-event-home-link>
        <i class="bi bi-arrow-left" aria-hidden="true"></i><span data-i18n="back_home">Back to Home</span>
      </a>
    </div>

    <div id="publicVotesLoading" class="card public-vote-card public-voting-state">
      <div class="card-body text-center py-5">
        <div class="spinner-border text-primary" role="status"><span class="visually-hidden" data-i18n="loading">Loading...</span></div>
        <p class="text-body-secondary mt-3 mb-0" data-i18n="loading_sessions">Loading voting sessions...</p>
      </div>
    </div>

    <div id="publicVotesError" class="alert alert-danger lm-notice d-none" role="alert">
      <div class="d-flex flex-column flex-sm-row align-items-sm-center gap-3">
        <span class="me-auto" id="publicVotesErrorText"></span>
        <button class="lm-btn lm-btn-danger" type="button" id="retryPublicVotesBtn" data-i18n="retry">Try again</button>
      </div>
    </div>

    <div id="publicVotesEmpty" class="card public-vote-card public-voting-state d-none">
      <div class="card-body text-center py-5 px-3">
        <i class="bi bi-megaphone text-body-secondary" style="font-size:3rem"></i>
        <h2 class="h4 mt-3" data-i18n="empty_title">No voting sessions are available right now.</h2>
        <a class="lm-btn lm-btn-primary mt-3" href="home.html" data-event-home-link><i class="bi bi-house" aria-hidden="true"></i><span data-i18n="back_home">Back to Home</span></a>
      </div>
    </div>

    <div id="publicVotesContent" class="d-none">
      <section id="openVotesSection" class="public-votes-section d-none" aria-labelledby="openVotesHeading">
        <div class="public-votes-section-heading">
          <span class="public-votes-section-icon public-votes-section-icon--live"><i class="bi bi-broadcast" aria-hidden="true"></i></span>
          <h2 id="openVotesHeading" data-i18n="open_sessions">Open voting</h2>
        </div>
        <div class="row g-3" id="openVotesList"></div>
      </section>

      <section id="publishedVotesSection" class="public-votes-section d-none" aria-labelledby="publishedVotesHeading">
        <div class="public-votes-section-heading">
          <span class="public-votes-section-icon public-votes-section-icon--results"><i class="bi bi-trophy" aria-hidden="true"></i></span>
          <h2 id="publishedVotesHeading" data-i18n="published_sessions">Published results</h2>
        </div>
        <div class="row g-3" id="publishedVotesList"></div>
      </section>
    </div>
  </main>

  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/common.js?v=20260917"></script>
  <script src="js/public-votes.js"></script>
</body>
</html>
