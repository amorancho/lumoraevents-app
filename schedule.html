<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon32.png" type="image/png">
  <title data-i18n="title">Participants</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/lumora-ui.css">
  <link rel="stylesheet" href="css/schedule.css?v=20260930-5">
  <script src="https://cdn.counter.dev/script.js" data-id="b4163310-ede9-4a5d-8386-8fe6df71a9fb" data-utcoffset="2"></script>
</head>

<body class="d-flex flex-column min-vh-100 schedule-page">
  <div id="header"></div>

  <main class="lm-page">
    <div class="lm-container schedule-content">
      <div class="schedule-instagram-section">
        <a class="schedule-instagram-card" href="https://www.instagram.com/lumoraevents.app/" target="_blank" rel="noopener noreferrer" aria-label="Instagram lumoraevents.app">
          <span class="schedule-instagram-icon" aria-hidden="true"><i class="bi bi-instagram"></i></span>
          <span class="schedule-instagram-title" data-i18n="instagram_follow_message">Síguenos para no perderte nada</span>
          <span class="schedule-instagram-handle">@lumoraevents.app <i class="bi bi-arrow-up-right" aria-hidden="true"></i></span>
        </a>
      </div>

      <div id="scheduleRefreshDefaultSlot" class="schedule-refresh-default" hidden>
        <button type="button" class="lm-btn lm-btn-secondary" id="refreshScheduleBtn" data-i18n="update">
          <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
          <span>Update</span>
        </button>
      </div>

      <div id="scheduleHighlightContainer" class="schedule-highlight-container" style="display: none;"></div>

      <div id="noticePanel" class="schedule-notice" style="display: none;">
        <div class="alert alert-dismissible fade show lm-notice" role="alert" id="notice_type">
          <div id="notice_text"></div>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      </div>

      <div id="scheduleContainer"></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/common.js?v=20260917"></script>
  <script src="js/schedule.js?v=20260930-3"></script>
</body>
</html>
