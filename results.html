<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon32.png" type="image/png">
  <title data-i18n="title">Results</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/lumora-ui.css?v=20260930-1">
  <link rel="stylesheet" href="css/results.css?v=20260930-1">
  <script src="https://cdn.counter.dev/script.js" data-id="b4163310-ede9-4a5d-8386-8fe6df71a9fb" data-utcoffset="2"></script>
</head>

<body class="d-flex flex-column min-vh-100 results-page">
  <div id="header"></div>

  <main class="lm-page">
    <div class="lm-container results-content">
      <div class="lm-instagram-section">
        <a class="lm-instagram-card" href="https://www.instagram.com/lumoraevents.app/" target="_blank" rel="noopener noreferrer" aria-label="Instagram lumoraevents.app">
          <span class="lm-instagram-icon" aria-hidden="true"><i class="bi bi-instagram"></i></span>
          <span class="lm-instagram-title" data-i18n="instagram_follow_message">Síguenos para no perderte nada</span>
          <span class="lm-instagram-handle">@lumoraevents.app <i class="bi bi-arrow-up-right" aria-hidden="true"></i></span>
        </a>
      </div>

      <div id="noticePanel" class="results-notice" style="display: none;">
        <div class="alert alert-dismissible fade show lm-notice" role="alert" id="notice_type">
          <div id="notice_text"></div>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      </div>

      <section class="results-filter-panel">
        <div class="results-filter-controls">
          <div id="categoryFilter" class="results-filter-field">
            <label class="visually-hidden" for="categorySelect" data-i18n="select_category">Select Category</label>
            <i class="bi bi-people-fill results-filter-icon" aria-hidden="true"></i>
            <select class="form-select" id="categorySelect"></select>
          </div>

          <div id="styleFilter" class="results-filter-field d-none">
            <label class="visually-hidden" for="styleSelect" data-i18n="select_style">Select Style</label>
            <i class="bi bi-lightning-charge-fill results-filter-icon" aria-hidden="true"></i>
            <select class="form-select" id="styleSelect"></select>
          </div>

          <button id="refreshBtn" class="lm-btn lm-btn-secondary results-refresh-btn" data-i18n="refresh" disabled>
            Refresh
          </button>
        </div>
      </section>

      <div class="results-selection d-none" id="categoriaBadge">
        <i class="bi bi-trophy-fill" aria-hidden="true"></i>
        <span></span>
      </div>

      <p class="results-help d-none" id="infoText" data-i18n="info_click_dancer">
        Click on each participant to see their voting details.
      </p>

      <div id="resultsContainer" aria-live="polite"></div>
    </div>
  </main>

  <div class="modal fade results-modal" id="votingDetailsModal" tabindex="-1" aria-labelledby="votingDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="votingDetailsModalLabel" data-i18n="voting_details">Voting Details</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="votingDetailsContainer"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="lm-btn lm-btn-secondary" data-bs-dismiss="modal" data-i18n="cerrar">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade results-modal" id="styleVotingDetailsModal" tabindex="-1" aria-labelledby="styleVotingDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5 d-flex align-items-center gap-2 flex-wrap">
            <span id="styleVotingDetailsModalLabel" data-i18n="style_voting_details">Style Voting Details</span>
            <span id="styleVotingDetailsModalMaxScore" class="results-modal-max d-none"></span>
          </h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="styleVotingOrientationHint" class="results-orientation-hint d-none style-voting-orientation-hint" role="alert">
            <i class="bi bi-phone-landscape" aria-hidden="true"></i>
            <span data-i18n="rotate_device_hint">For a better view of this table, rotate your device horizontally.</span>
          </div>
          <div id="styleVotingDetailsContainer"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="lm-btn lm-btn-secondary" data-bs-dismiss="modal" data-i18n="cerrar">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/common.js?v=20260917"></script>
  <script src="js/results.js?v=20260930-1"></script>
</body>
</html>
