<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon32.png" type="image/png">
  <title data-i18n="title">Statistics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/lumora-ui.css?v=20260930-1">
  <link rel="stylesheet" href="css/statistics.css?v=20260930-3">
  <script src="https://cdn.counter.dev/script.js" data-id="b4163310-ede9-4a5d-8386-8fe6df71a9fb" data-utcoffset="2"></script>
</head>

<body class="d-flex flex-column min-vh-100 statistics-page">
  <div id="header"></div>

  <main class="lm-page">
    <div class="lm-container statistics-content">
      <div class="lm-instagram-section">
        <a class="lm-instagram-card" href="https://www.instagram.com/lumoraevents.app/" target="_blank" rel="noopener noreferrer" aria-label="Instagram lumoraevents.app">
          <span class="lm-instagram-icon" aria-hidden="true"><i class="bi bi-instagram"></i></span>
          <span class="lm-instagram-title" data-i18n="instagram_follow_message">Síguenos para no perderte nada</span>
          <span class="lm-instagram-handle">@lumoraevents.app <i class="bi bi-arrow-up-right" aria-hidden="true"></i></span>
        </a>
      </div>

      <section class="statistics-search-panel">
        <form id="statsForm" class="statistics-search-form">
          <div class="statistics-code-field">
            <i class="bi bi-person-badge" aria-hidden="true"></i>
            <label class="visually-hidden" for="dancerCode" data-i18n="enter_dancer_code">Enter participant code</label>
            <input type="text" class="form-control" id="dancerCode" placeholder="Enter participant code" maxlength="15" autocomplete="off" data-i18n-placeholder="enter_dancer_code">
          </div>
          <button type="submit" class="lm-btn lm-btn-secondary statistics-submit-btn" id="getStatsBtn">
            <i class="bi bi-graph-up-arrow" aria-hidden="true"></i>
            <span data-i18n="get_stats">Get Stats</span>
          </button>
        </form>
      </section>

      <div id="statsAlert" class="statistics-alert" aria-live="polite"></div>
      <div id="statisticsContainer" class="statistics-grid" aria-live="polite"></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/common.js?v=20260917"></script>
  <script src="js/statistics.js?v=20260930-2"></script>
</body>
</html>
