<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon32.png" type="image/png">
  <title>Registration - LumoraEvents</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/lumora-ui.css?v=20261004-3">
  <link rel="stylesheet" href="css/registration-access.css?v=20261014-1">
  <script src="https://cdn.counter.dev/script.js" data-id="b4163310-ede9-4a5d-8386-8fe6df71a9fb" data-utcoffset="2"></script>
</head>
<body class="d-flex flex-column min-vh-100 registration-access-page registration-home-page">
  
  <div id="header"></div>  
  <main class="lm-page flex-grow-1 registration-access-main">
    <div class="registration-access-shell registration-home-shell">
      <header class="registration-access-intro">
        <span class="registration-access-mark" aria-hidden="true"><i class="bi bi-person-vcard"></i></span>
        <h1 data-i18n="registrationhome_heading">School registration</h1>
        <p data-i18n="registrationhome_sub">Sign in to manage your registrations or create a new account.</p>
      </header>
      <div class="registration-options">
        <section class="registration-option lm-card">
          <span class="registration-option-icon" aria-hidden="true"><i class="bi bi-box-arrow-in-right"></i></span>
          <div class="registration-option-copy">
            <h2 data-i18n="registrationhome_login_title">Sign in</h2>
            <p data-i18n="registrationhome_login_sub">Access with your school account.</p>
          </div>
          <a id="loginLink" class="lm-btn lm-btn-primary registration-option-action" href="login.html"><span data-i18n="registrationhome_login_btn">Go to login</span><i class="bi bi-arrow-right" aria-hidden="true"></i></a>
        </section>
        <section class="registration-option lm-card">
          <span class="registration-option-icon registration-option-icon-secondary" aria-hidden="true"><i class="bi bi-person-plus"></i></span>
          <div class="registration-option-copy">
            <h2 data-i18n="registrationhome_signup_title">Create account</h2>
            <p data-i18n="registrationhome_signup_sub">New school? Start your registration.</p>
          </div>
          <a id="signupLink" class="lm-btn lm-btn-secondary registration-option-action" href="registrationsignup.html"><span data-i18n="registrationhome_signup_btn">Create account</span><i class="bi bi-arrow-right" aria-hidden="true"></i></a>
        </section>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/common.js?v=20260917"></script>
  <script src="js/registrationhome.js"></script>

</body></html>
